
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eni-flask
  labels:
    app: eni-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eni-flask
  template:
    metadata:
      labels:
        app: eni-flask
    spec:
      containers:
        - name: flask
          image: heritsilavo/eni-flask-app:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
